<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1200 900"><title id="title">dbskill 知识来源图</title><desc id="desc">dbskill 从 16152 条公开推文中筛选和结构化出 4176 个知识原子，并将方法沉淀为 31 个正式业务 Skill 和 1 个系统更新入口。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563EB" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.eyebrow{font-size:16px;font-weight:700;letter-spacing:1.8px;fill:#2563eb}.title{font-size:38px;font-weight:700;fill:#0f172a}.subtitle{font-size:18px;font-weight:400;fill:#64748b}.index,.index-inverse{font-size:14px;font-weight:700;fill:#94a3b8}.index-inverse{fill:#bfdbfe}.label{font-weight:700;fill:#0f172a}.label,.label-inverse{font-size:20px}.label-inverse,.number{font-weight:700}.label-inverse{fill:#fff}.number{font-size:44px;fill:#0f172a}.number-inverse{font-size:42px;font-weight:700;fill:#fff}.body,.body-inverse{font-size:16px;font-weight:400;fill:#64748b}.body-inverse{fill:#dbeafe}.asset-label,.pill{font-weight:700}.pill{font-size:14px;fill:#2563eb}.asset-label{font-size:17px;fill:#0f172a}.asset-body{font-size:15px;font-weight:400;fill:#64748b}.node,.node-soft{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.node-soft{fill:#eff6ff;stroke:#93c5fd}.line,.node-strong{stroke:#2563eb}.node-strong{fill:#2563eb;stroke-width:1.5}.line{fill:none;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.footer{font-size:16px;font-weight:600;fill:#334155}</style></defs><rect width="1200" height="900" fill="#F8FAFC"/><rect width="40" height="6" x="72" y="68" fill="#2563EB" rx="3"/><text x="128" y="78" class="eyebrow">DBSKILL · 知识来源</text><text x="72" y="137" class="title">把长期内容积累变成可调用能力</text><text x="72" y="177" class="subtitle">公开内容经过筛选、拆分和标注，最终进入知识库与正式 Skill。</text><rect width="236" height="244" x="72" y="250" class="node" rx="18"/><text x="96" y="282" class="index">01 · SOURCE</text><text x="96" y="326" class="label">公开推文</text><text x="96" y="388" class="number">16,152</text><text x="96" y="430" class="body">dontbesilent 长期内容积累</text><text x="96" y="458" class="body">持续提供事实、判断和方法</text><path d="M308 372 H347" class="line"/><rect width="236" height="244" x="356" y="250" class="node-soft" rx="18"/><text x="380" y="282" class="index">02 · PROCESS</text><text x="380" y="326" class="label">知识结构化</text><rect width="72" height="34" x="380" y="354" fill="#DBEAFE" rx="17"/><rect width="72" height="34" x="460" y="354" fill="#DBEAFE" rx="17"/><rect width="72" height="34" x="380" y="398" fill="#DBEAFE" rx="17"/><text x="416" y="377" class="pill" text-anchor="middle">筛选</text><text x="496" y="377" class="pill" text-anchor="middle">拆分</text><text x="416" y="421" class="pill" text-anchor="middle">标注</text><text x="380" y="462" class="body">保留可检索、可引用的内容</text><path d="M592 372 H631" class="line"/><rect width="236" height="244" x="640" y="250" class="node" rx="18"/><text x="664" y="282" class="index">03 · ATOMS</text><text x="664" y="326" class="label">知识原子</text><text x="664" y="388" class="number">4,176</text><text x="664" y="430" class="body">可检索、可引用、可重组</text><text x="664" y="458" class="body">形成稳定的知识底座</text><path d="M876 372 H915" class="line"/><rect width="204" height="244" x="924" y="250" class="node-strong" rx="18"/><text x="948" y="282" class="index-inverse">04 · SKILLS</text><text x="948" y="326" class="label-inverse">可调用能力</text><text x="948" y="386" class="number-inverse">31 + 1</text><text x="948" y="426" class="body-inverse">31 个正式业务 Skill</text><text x="948" y="456" class="body-inverse">1 个系统更新入口</text><text x="72" y="565" class="eyebrow">公开资产</text><rect width="320" height="132" x="72" y="596" class="node" rx="18"/><circle cx="102" cy="630" r="8" fill="#2563EB"/><text x="124" y="636" class="asset-label">atoms.jsonl</text><text x="96" y="677" class="asset-body">结构化知识原子的机器可读数据</text><text x="96" y="703" class="asset-body">适合搜索、分析与 RAG</text><rect width="320" height="132" x="440" y="596" class="node" rx="18"/><circle cx="470" cy="630" r="8" fill="#2563EB"/><text x="492" y="636" class="asset-label">Skill 知识包</text><text x="464" y="677" class="asset-body">按能力整理的方法、边界和案例</text><text x="464" y="703" class="asset-body">支持稳定调用与持续维护</text><rect width="320" height="132" x="808" y="596" class="node" rx="18"/><circle cx="838" cy="630" r="8" fill="#2563EB"/><text x="860" y="636" class="asset-label">高频概念词典</text><text x="832" y="677" class="asset-body">统一核心概念的定义与使用方式</text><text x="832" y="703" class="asset-body">减少多次调用中的语义漂移</text><rect width="1056" height="58" x="72" y="798" fill="#E2E8F0" rx="14"/><circle cx="101" cy="827" r="7" fill="#2563EB"/><text x="120" y="833" class="footer">从公开内容到正式 Skill，每一层都保留可检查、可更新的中间资产。</text></svg>