<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" aria-labelledby="title desc" role="img" viewBox="0 0 1200 900"><title id="title">dbskill 单任务动态编排图</title><desc id="desc">真实任务先交给 dbs。dbs 判断单个 Skill 是否足够，需要多项独立能力时编排一个主 Skill 和最多两个辅助 Skill，再生成可直接发送的提示词。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path fill="#2563EB" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}.eyebrow{font-size:16px;font-weight:700;letter-spacing:1.8px;fill:#2563eb}.title{font-size:38px;font-weight:700;fill:#0f172a}.subtitle{font-size:18px;font-weight:400;fill:#64748b}.index,.index-inverse{font-size:14px;font-weight:700;fill:#94a3b8}.index-inverse{fill:#bfdbfe}.label,.label-inverse{font-size:21px;font-weight:700;fill:#0f172a}.label-inverse{fill:#fff}.body,.body-inverse{font-size:16px;font-weight:400;fill:#64748b}.body-inverse{fill:#dbeafe}.condition{font-size:15px;font-weight:700;fill:#2563eb}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.node-accent,.node-strong{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}.node-strong{fill:#2563eb;stroke:#2563eb}.line,.rail{fill:none;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}.rail{stroke:#93c5fd;stroke-width:2}.footer{font-size:16px;font-weight:600;fill:#334155}</style></defs><rect width="1200" height="900" fill="#F8FAFC"/><rect width="40" height="6" x="72" y="68" fill="#2563EB" rx="3"/><text x="128" y="78" class="eyebrow">DBSKILL · 动态编排</text><text x="72" y="137" class="title">每次只推进一个当前任务</text><text x="72" y="177" class="subtitle">单个 Skill 足够时保持简单，复杂任务使用主辅组合。</text><rect width="220" height="146" x="72" y="252" class="node" rx="18"/><text x="96" y="282" class="index">01 · INPUT</text><text x="96" y="330" class="label">真实任务</text><text x="96" y="362" class="body">材料、问题或新反馈</text><path d="M292 325 H327" class="line"/><rect width="176" height="146" x="336" y="252" class="node-strong" rx="18"/><text x="360" y="282" class="index-inverse">02 · COMPOSE</text><text x="360" y="330" class="label-inverse">/dbs</text><text x="360" y="362" class="body-inverse">读取上下文并编排</text><path d="M512 325 H547" class="line"/><rect width="236" height="146" x="556" y="252" class="node" rx="18"/><text x="580" y="282" class="index">03 · PLAN</text><text x="580" y="330" class="label">单项或主辅组合</text><text x="580" y="362" class="body">最多 1 个主 Skill＋2 个辅助</text><path d="M792 325 H827" class="line"/><rect width="292" height="146" x="836" y="252" class="node" rx="18"/><text x="860" y="282" class="index">04 · OUTPUT</text><text x="860" y="330" class="label">任务提示词</text><text x="860" y="362" class="body">说明理由、分工与执行边界</text><text x="72" y="480" class="eyebrow">结果反馈后的 3 种状态</text><path d="M982 398 V520 H232" class="rail"/><path d="M232 520 H968" class="rail"/><path d="M232 520 V557" class="line"/><path d="M600 520 V557" class="line"/><path d="M968 520 V557" class="line"/><rect width="320" height="170" x="72" y="566" class="node-accent" rx="18"/><text x="96" y="600" class="condition">没有完成／出现新反馈</text><text x="96" y="648" class="label">回到 /dbs</text><text x="96" y="682" class="body">带着本轮结论重新编排</text><text x="96" y="708" class="body">无需重复描述材料</text><rect width="320" height="170" x="440" y="566" class="node" rx="18"/><text x="464" y="600" class="condition">已经明确下一步</text><text x="464" y="648" class="label">尊重用户选择</text><text x="464" y="682" class="body">直接进入明确指定的能力</text><rect width="320" height="170" x="808" y="566" class="node" rx="18"/><text x="832" y="600" class="condition">当前任务已经完成</text><text x="832" y="648" class="label">直接结束</text><text x="832" y="682" class="body">没有新目标时不制造下一步</text><rect width="1056" height="58" x="72" y="798" fill="#E2E8F0" rx="14"/><circle cx="101" cy="827" r="7" fill="#2563EB"/><text x="120" y="833" class="footer">原则：一次只处理 1 个任务；组合只服务当前交付，不保存为固定长链。</text></svg>